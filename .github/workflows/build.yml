name: Build binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: MentalCalc.exe
          - os: ubuntu-24.04   # matches Linux Mint 22.x (Ubuntu 24.04 base)
            artifact: MentalCalc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GTK runtime (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libsdl2-2.0-0 libnotify4

      - name: Install wxPython (Linux, prebuilt wheel)
        if: runner.os == 'Linux'
        run: pip install --only-binary wxPython -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 wxPython

      - name: Install dependencies
        run: pip install wxPython python-docx pyinstaller

      - name: Build
        run: pyinstaller MentalCalc.spec --noconfirm

      - name: Rename Linux binary
        if: runner.os == 'Linux'
        run: mv dist/MentalCalc dist/MentalCalc-linux-mint22-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: MentalCalc-${{ runner.os }}
          path: dist/*

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
